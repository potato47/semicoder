name: Quality and release
run-name: ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标（仅 main；生产发布会先验证预发布）"
        type: choice
        default: staging
        options:
          - staging
          - production
permissions:
  contents: read
concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::手动发布请在 Run workflow 中选择 main 分支。"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate content and Worker types
        run: bun run prepare
      - run: bun run check
      - run: bun run test
      - run: bun run test:workers
      - run: bun run build
      - run: bun run build:check
      - run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Documentation impact
        if: github.event_name == 'pull_request'
        run: bun run docs:impact
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
  staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.semicoder.dev
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?请在 staging environment 中配置 CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?请在 staging environment 中配置 CLOUDFLARE_ACCOUNT_ID}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate content and Worker types
        run: bun run prepare
      - name: Build, migrate, deploy and smoke test staging
        run: bun run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://semicoder.dev
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?请在 production environment 中配置 CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?请在 production environment 中配置 CLOUDFLARE_ACCOUNT_ID}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate content and Worker types
        run: bun run prepare
      - name: Build, migrate, deploy and smoke test production
        run: bun run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
